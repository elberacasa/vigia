name: Accessibility

# axe-core (WCAG 2.2 A/AA) on every page, dark and light, desk and phone, against a fresh Vigía with no data and no
# network fetches (scripts/a11y.ts). Slower than `bun run check`, so it runs on demand and when the UI changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "src/server/pages/**"
      - "scripts/a11y.ts"

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - run: bun scripts/build-web.ts
      - name: Start Vigía (no fetches, empty data)
        run: |
          VIGIA_HOME="$RUNNER_TEMP/vigia" bun src/cli.ts --no-fetch --no-open --port 7722 > "$RUNNER_TEMP/vigia.log" 2>&1 &
          for i in $(seq 1 30); do VIGIA_PORT=7722 bun src/cli.ts healthcheck && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vigia.log"; exit 1
      - run: bun scripts/a11y.ts http://localhost:7722
