name: Release

# A tag v* (e.g. v0.1.0) builds the five single-file executables, smoke-tests each one on a runner of its own OS and
# architecture (darwin-x64 on an Intel macOS runner), packs them (.tar.xz / .zip), writes SHA256SUMS over archives and
# executables, and attaches everything to a DRAFT release whose notes are docs/releases/<tag>.md. Nothing is
# published until a maintainer reviews the draft and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version and has release notes
        shell: bash
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi
          test -s "docs/releases/$TAG.md" || { echo "::error::docs/releases/$TAG.md is missing"; exit 1; }
      - run: bun run check
        env:
          QUIET: "1"

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, exe: "" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, exe: "" }
          - { target: darwin-x64, runner: macos-26-intel, exe: "" }
          - { target: darwin-arm64, runner: macos-26, exe: "" }
          - { target: windows-x64, runner: windows-2025, exe: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-bin.ts ${{ matrix.target }}
        env:
          QUIET: "1"
      # The built executable on its own OS: version, a fresh start with no keys and no fetches, the app, the API,
      # the host guard, and a clean exit. Runs in bash on every OS (Git Bash on Windows).
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="dist/vigia-${TAG#v}-${{ matrix.target }}${{ matrix.exe }}"
          test -x "$bin" || test -f "$bin"
          test "$("$bin" --version | tr -d '\r')" = "vigia ${TAG#v}"
          export VIGIA_HOME="$RUNNER_TEMP/vigia-home"
          "$bin" --no-fetch --no-open --port 7799 > "$RUNNER_TEMP/vigia.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:7799/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat "$RUNNER_TEMP/vigia.log"; exit 1; fi
          curl -sf -A "Mozilla/5.0" -H "Accept: text/html" http://127.0.0.1:7799/ | grep -qi '<!doctype html'
          curl -sf http://127.0.0.1:7799/ | grep -q "VIGÍA"
          curl -sf http://127.0.0.1:7799/api/v1 | grep -q "\"version\":\"${TAG#v}\""
          curl -sf -o /dev/null http://127.0.0.1:7799/api/v1/openapi.json
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:7799/)"
          test "$code" = 421
          VIGIA_PORT=7799 "$bin" healthcheck
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/vigia.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vigia-${{ matrix.target }}
          path: dist/vigia-*-${{ matrix.target }}${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: vigia-*
          merge-multiple: true
      # The archives are the primary downloads (slow connections): .tar.xz for Linux and macOS with the executable
      # bit kept, .zip for Windows, each with LICENSE and NOTICE; SHA256SUMS covers archives and raw executables.
      - name: Archives and checksums
        run: |
          chmod +x dist/vigia-*
          bun scripts/package-release.ts dist
          ls -l dist
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          tar -tvJf "dist/vigia-${TAG#v}-linux-x64.tar.xz" | grep -q -- "-rwxr-xr-x 0/0 .* vigia-${TAG#v}-linux-x64/vigia$"
      - name: Create the draft release (a maintainer reviews and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/vigia-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Vigía ${TAG#v}" \
            --notes-file "docs/releases/$TAG.md"
