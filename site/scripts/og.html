@font-face { font-family: "Archivo"; src: url("../src/fonts/archivo-2.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Chivo Mono"; src: url("../src/fonts/chivo-mono-1.woff2") format("woff2"); font-weight: 400 700; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #07090e; color: #edeff3; font-family: "Archivo", sans-serif; -webkit-font-smoothing: antialiased; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(108 180 255 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(108 180 255 / .05) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse 80% 90% at 20% 30%, black, transparent); }
.glow { position: absolute; left: -200px; top: -260px; width: 900px; height: 700px; background: radial-gradient(closest-side, rgb(246 181 50 / .10), transparent); }
.left { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 600px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 16px; }
h1 { margin-top: auto; font-size: 76px; font-weight: 700; letter-spacing: -0.035em; line-height: 0.98; }
h1 span { display: block; color: #8a94a7; font-size: 40px; line-height: 1.08; margin-top: 14px; letter-spacing: -0.03em; }
.meta { margin-top: 34px; font-family: "Chivo Mono", monospace; font-size: 18px; color: #aab2c0; display: flex; gap: 14px; align-items: center; }
.meta i { width: 4px; height: 4px; border-radius: 2px; background: #333c4d; display: inline-block; }
.shot { position: absolute; left: 680px; top: 70px; width: 820px; height: 512px; border-radius: 16px; border: 1px solid #333c4d; overflow: hidden; box-shadow: 0 40px 100px rgb(0 0 0 / .7); background: #0b0e14; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: 0 0; display: block; }
.shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, rgb(7 9 14 / .5)); }
.mark .v { fill: none; stroke: #edeff3; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.mark circle { fill: #f6b532; }
</style>
</head>
